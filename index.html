<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Application & Beneficiary Portal</title>
    <style>
        :root {
            --primary-color: #008000;
            --primary-hover: #006400;
            --whatsapp-color: #25D366;
            --whatsapp-hover: #1EBE5D;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 20px;
        }

        /* Top Banner Section */
        .top-banner {
            width: 100%;
            background-color: #ffffff;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
        }

        .top-banner img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }

        /* Header Section */
        .header {
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 15px;
        }

        .header h1 {
            font-size: 1.3rem;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Step Section Styling */
        .content-body {
            padding: 20px;
        }

        .step-box {
            display: none;
        }

        .step-box.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-whatsapp {
            background-color: var(--whatsapp-color);
            margin-bottom: 10px;
        }

        .btn-whatsapp:hover {
            background-color: var(--whatsapp-hover);
        }

        .btn-withdraw {
            background-color: #d9534f;
            display: none;
            margin-top: 15px;
            font-size: 1.1rem;
        }

        .btn-withdraw:hover {
            background-color: #c9302c;
        }

        /* Challenge / Progress Bar */
        .progress-container {
            margin: 20px 0;
            text-align: center;
        }

        .progress-label {
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 10px;
            height: 22px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: var(--whatsapp-color);
            text-align: center;
            line-height: 22px;
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            transition: width 0.4s ease;
        }

        /* Receivers Ticker / Live Feed */
        .feed-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .feed-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            color: var(--primary-color);
        }

        .feed-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.85rem;
            animation: fadeIn 0.5s ease-in-out;
        }

        .feed-item:last-child {
            border-bottom: none;
        }

        .receiver-name {
            font-weight: bold;
        }

        .amount-tag {
            color: var(--primary-color);
            font-weight: bold;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Modal Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            max-width: 350px;
            width: 90%;
        }

        .modal-card h2 {
            color: #d9534f;
            margin-bottom: 10px;
        }

        .modal-card p {
            font-size: 0.95rem;
            margin-bottom: 20px;
            color: #555;
        }

        .modal-card button {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Top Image Header -->
        <div class="top-banner">
            <img src="https://via.placeholder.com/600x200?text=Official+Grant+Portal+Header" alt="Grant Header Banner" id="headerImage">
        </div>

        <div class="header">
            <h1>NATIONAL BENEFICIARY PORTAL</h1>
            <p>Verification & Distribution System</p>
        </div>

        <div class="content-body">
            <!-- STEP 1: Personal Details Form -->
            <div id="step1" class="step-box active">
                <form id="infoForm" onsubmit="handleStep1(event)">
                    <div class="form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter phone number" required>
                    </div>
                    <div class="form-group">
                        <label for="state">State / Region</label>
                        <input type="text" id="state" placeholder="Enter your location" required>
                    </div>
                    <button type="submit" class="btn">Proceed to Verification</button>
                </form>
            </div>

            <!-- STEP 2: WhatsApp Share Challenge -->
            <div id="step2" class="step-box">
                <h3 style="text-align: center; margin-bottom: 10px;">Verification Step</h3>
                <p style="font-size: 0.85rem; text-align: center; margin-bottom: 15px;">
                    Share this portal to <strong>10 friends</strong> and <strong>10 groups</strong> on WhatsApp to complete your application challenge.
                </p>

                <!-- Challenge Progress Bar Container -->
                <div class="progress-container">
                    <div class="progress-label">Challenge Progress: <span id="percentText">0%</span></div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="progressBar">0%</div>
                    </div>
                </div>

                <button class="btn btn-whatsapp" onclick="shareWhatsapp()">Share on WhatsApp</button>
                
                <!-- Withdraw Button (Hidden until 100% completion) -->
                <button class="btn btn-withdraw" id="withdrawBtn" onclick="openModal()">Withdraw Grant</button>
            </div>
        </div>
    </div>

    <!-- Live Receivers List (Updates every 10 seconds, up to 30 total names) -->
    <div class="feed-container">
        <div class="feed-title">Recent Approved Beneficiaries</div>
        <div id="receiversList"></div>
    </div>

    <!-- Notification Modal for Withdrawal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-card">
            <h2>Status Pending</h2>
            <p>Wait for Next Batch</p>
            <button class="btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <script>
        // --- Step 1 Navigation ---
        function handleStep1(e) {
            e.preventDefault();
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }

        // --- Step 2 WhatsApp Share Tracker ---
        let shareClicks = 0;
        const totalRequiredShares = 20; // 10 friends + 10 groups = 20 total actions

        function shareWhatsapp() {
            shareClicks++;
            let percentage = Math.min(Math.round((shareClicks / totalRequiredShares) * 100), 100);

            // Update Progress Bar
            const bar = document.getElementById('progressBar');
            const label = document.getElementById('percentText');
            bar.style.width = percentage + '%';
            bar.innerText = percentage + '%';
            label.innerText = percentage + '%';

            // Launch WhatsApp share dialog
            const shareText = encodeURIComponent("Check out the official National Grant Portal and claim your verification bonus!");
            window.open(`https://api.whatsapp.com/send?text=${shareText}`, '_blank');

            // Show Withdraw button when 100% reached
            if (percentage >= 100) {
                document.getElementById('withdrawBtn').style.display = 'block';
            }
        }

        // --- Modal Popup ---
        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // --- 30 Beneficiary Names Data Pool ---
        const firstNames = ["Amina", "Chidi", "Emeka", "Fatima", "Ibrahim", "Ngozi", "Boluwatife", "Yusuf", "Zainab", "Olumide", "Kelechi", "Usman", "Grace", "David", "Tunde"];
        const lastNames = ["Abubakar", "Okafor", "Adeyemi", "Bello", "Eze", "Danjuma", "Nwosu", "Olamide", "Garba", "Okeke", "Adebayo", "Musa", "Nwachukwu", "Lawal", "Igwe"];

        // Pool of up to 30 entries
        let beneficiaries = [];
        for (let i = 0; i < 30; i++) {
            const randomFirst = firstNames[i % firstNames.length];
            const randomLast = lastNames[(i * 3) % lastNames.length];
            beneficiaries.push({
                name: `${randomFirst} ${randomLast.charAt(0)}.`,
                amount: `₦${(Math.floor(Math.random() * 6) + 5) * 10},000`,
                time: `${Math.floor(Math.random() * 59) + 1} secs ago`
            });
        }

        let currentIndex = 0;
        const displayLimit = 5; // Displays 5 items visible at a time

        function renderReceivers() {
            const container = document.getElementById('receiversList');
            container.innerHTML = "";

            for (let i = 0; i < displayLimit; i++) {
                const itemIndex = (currentIndex + i) % beneficiaries.length;
                const item = beneficiaries[itemIndex];

                const row = document.createElement('div');
                row.className = 'feed-item';
                row.innerHTML = `
                    <span class="receiver-name">${item.name}</span>
                    <span>Received <span class="amount-tag">${item.amount}</span></span>
                    <span style="color:#777; font-size:0.75rem;">${item.time}</span>
                `;
                container.appendChild(row);
            }

            // Shift index forward by 1 every update cycle
            currentIndex = (currentIndex + 1) % beneficiaries.length;
        }

        // Initial render
        renderReceivers();

        // Refresh feed content every 10 seconds (10000 ms)
        setInterval(renderReceivers, 10000);
    </script>
    </body>
</html>
